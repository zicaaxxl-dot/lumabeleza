<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – Luma Beleza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Great+Vibes&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="checkout-page">
  <header class="ck-top">
    <a class="logo" href="index.html" aria-label="Luma Beleza">
      <span class="script" style="font-size:28px">luma</span>
      <span class="word" style="font-size:16px">beleza</span>
    </a>
    <div class="ck-secure">🔒 Compra segura</div>
  </header>

  <div class="ck-banner">
    <img src="images/checkout/basecheckout.jpg" alt="Entrega garantida em até 7 dias úteis. Promoção exclusiva apenas hoje.">
  </div>

  <main class="ck-wrap">
    <form id="checkout">
      <section class="ck-card">
        <h2><span class="step-n">1</span> Identificação</h2>
        <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" autocomplete="name" required></div>
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="grid-2">
          <div class="field"><label for="telefone">Celular</label><input id="telefone" name="telefone" inputmode="tel" autocomplete="tel" required></div>
          <div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" required></div>
        </div>
        <p class="error" id="err-id"></p>
      </section>

      <section class="ck-card">
        <h2><span class="step-n">2</span> Entrega</h2>
        <div class="field"><label for="cep">CEP</label><input id="cep" name="cep" inputmode="numeric" autocomplete="postal-code" required></div>
        <div class="field"><label for="rua">Endereço</label><input id="rua" name="rua" autocomplete="address-line1" required></div>
        <div class="grid-2">
          <div class="field"><label for="numero">Número</label><input id="numero" name="numero" required></div>
          <div class="field"><label for="complemento">Complemento</label><input id="complemento" name="complemento"></div>
        </div>
        <div class="field"><label for="bairro">Bairro</label><input id="bairro" name="bairro" required></div>
        <div class="grid-2">
          <div class="field"><label for="cidade">Cidade</label><input id="cidade" name="cidade" required></div>
          <div class="field"><label for="uf">UF</label><input id="uf" name="uf" maxlength="2" required></div>
        </div>
        <div class="pay-opt active">
          <input type="radio" checked disabled>
          <div><strong>Frete grátis</strong><div class="muted">Correios · até 7 dias úteis · R$ 0,00</div></div>
        </div>
        <p class="error" id="err-addr"></p>
      </section>

      <section class="ck-card">
        <h2><span class="step-n">3</span> Pagamento</h2>
        <label class="pay-opt active">
          <input type="radio" name="pagamento" value="pix" checked>
          <div>
            <strong>PIX</strong>
            <div class="muted">Aprovação na hora</div>
            <div class="pay-body">O código do pedido aparece na próxima tela para você concluir o pagamento.</div>
          </div>
        </label>
        <label class="pay-opt">
          <input type="radio" name="pagamento" value="cartao">
          <div>
            <strong>Cartão de crédito</strong>
            <div class="muted">Em até 10x</div>
            <div class="pay-body">
              <div class="field"><label for="cartao">Número do cartão</label><input id="cartao" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000"></div>
              <div class="field"><label for="nome-cartao">Nome impresso</label><input id="nome-cartao" autocomplete="cc-name"></div>
              <div class="grid-2">
                <div class="field"><label for="validade">Validade</label><input id="validade" placeholder="MM/AA" autocomplete="cc-exp"></div>
                <div class="field"><label for="cvv">CVV</label><input id="cvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4"></div>
              </div>
              <p class="muted">Os dados do cartão ficam só nesta tela e não são salvos.</p>
            </div>
          </div>
        </label>
        <label class="pay-opt">
          <input type="radio" name="pagamento" value="boleto">
          <div>
            <strong>Boleto</strong>
            <div class="muted">Compensação em 1 a 2 dias úteis</div>
            <div class="pay-body">O boleto é enviado para o e-mail informado depois da confirmação do pedido.</div>
          </div>
        </label>
        <p class="error" id="err-pay"></p>
      </section>

      <section class="ck-card" id="summary"></section>
      <button class="cta block" type="submit" id="finish">FINALIZAR PEDIDO</button>
      <p class="muted" style="text-align:center;margin-top:10px">Ambiente seguro · Frete grátis para todo o Brasil</p>
    </form>
  </main>
  <script src="js/store.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
